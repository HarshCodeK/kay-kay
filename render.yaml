services:
  - type: web
    name: kay-kay
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn kaykay.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: KAYKAY_ADMIN_TOKEN
        sync: false
